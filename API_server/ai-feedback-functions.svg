  <text x="126" y="972" class="small">SYSTEM_PROMPT · JSON · feedback 스키마</text>
  <path d="M316 983v31" class="line-blue"/>
  <text x="316" y="1046" text-anchor="middle" class="code" fill="#3156c8">return response.parsed</text>

  <!-- Script feedback lane -->
  <text x="592" y="385" class="heading">generate_script_feedback()</text>
