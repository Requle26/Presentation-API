  <text x="80" y="1176" class="small">공통 Gemini 설정: model=GEMINI_MODEL · response_mime_type=application/json · response_schema=feedback</text>
  <text x="80" y="1200" class="small">주의: 자료/대본 함수는 response.parsed를 바로 반환하며, parsed가 None인지 별도 검사하는 코드는 종합 함수에만 있습니다.</text>
