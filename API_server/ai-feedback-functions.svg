  <text x="80" y="112" class="title">ai_feedback_method.py 함수 흐름</text>
  <text x="80" y="144" class="subtitle">입력에 따라 Gemini 요청을 구성하고, Pydantic 스키마 기반 평가 결과를 반환합니다.</text>

