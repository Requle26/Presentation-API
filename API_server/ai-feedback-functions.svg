<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" role="img" aria-labelledby="title description">
  <title id="title">ai_feedback_method.py 함수 흐름도</title>
  <desc id="description">자료, 대본, 대본과 자료 종합 피드백 함수의 입력 처리, Gemini 요청 구성 및 구조화 결과 반환 과정을 비교한 다이어그램</desc>
